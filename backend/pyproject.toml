[tool.coverage.run]
branch = true
source = [ "platform" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report html:'../coverage/backend/html' --cov-report xml:'../coverage/backend/coverage.xml' --html='../reports/backend/unittests/html/index.html' --junitxml='../reports/backend/unittests/junit.xml'"

[tool.poetry]
name = "platform"
version = "1.0.0"
description = "Automatically generated by Nx."
authors = [ ]
license = 'Proprietary'
readme = 'README.md'

  [[tool.poetry.packages]]
  include = "platform"

  [tool.poetry.dependencies]
  python = ">=3.12,<=3.13"
  cffi = "^1.17.1"
  django-cors-headers = "^4.6.0"
  dj-database-url = "^2.3.0"
  python-dotenv = "^1.0.1"
  psycopg = "^3.2.3"
  psycopg-binary = "^3.2.3"
  psycopg-pool = "^3.2.4"
  tox = "^4.23.2"
  pytest-django = "^4.9.0"
  pytest = "^8.3.3"
  pyjwt = "^2.10.0"
  cryptography = "^43.0.3"
  redis = {extras = ["hiredis"], version = "^5.2.0"}
  httpx = "^0.27.2"
  django = "5.1.3"
  ruff = "^0.8.0"
  django-eventstream = "^5.3.1"
  websockets = "^14.1"
  msgpack = "^1.1.0"

  [tool.poetry.group.dev.dependencies]
  autopep8 = "2.3.1"
  ruff = "0.8.0"
  pytest = "8.3.3"
  pytest-sugar = "1.0.0"
  pytest-cov = "6.0.0"
  pytest-html = "4.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
