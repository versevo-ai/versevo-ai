name: Auto Assign PR Author

on:
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR Author
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              console.log(`Attempting to assign PR #${context.payload.pull_request.number} to author: ${context.payload.pull_request.user.login}`);

              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                assignees: [context.payload.pull_request.user.login]
              });

              console.log('Assignment successful');

            const welcomeMessage = `## 🎉 Welcome, @${context.payload.pull_request.user.login}!
            Thank you for contributing to **Versevo AI**! 🚀 Your pull request has been automatically assigned to you.
            ### 📋 What's Next?
            - ✅ Ensure all tests pass
            - ✅ Add or update documentation if needed
            - ✅ Request a review when ready
            - ✅ Address any feedback from reviewers

            ### 🤝 Need Help?
            - Check our [Contributing Guidelines](../CONTRIBUTING.md) for best practices
            - Tag a maintainer if you have questions

            We appreciate your contribution and look forward to reviewing your work! 💙`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: welcomeMessage
              });

              console.log('Welcome comment created successfully');
            } catch (error) {
              console.log(`Error details: ${JSON.stringify(error)}`);
              throw error;
            }